name: B1 and B2 validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAY_USAGE_STATS_ENABLED: "0"
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m robottrust.generator --episodes 100 --seed 42 --output evidence/episodes.jsonl
      - run: python -m robottrust.evaluator --input evidence/episodes.jsonl --output-dir evidence
      - run: python -c "from robottrust.evidence import verify_checksums; assert verify_checksums('evidence')"
