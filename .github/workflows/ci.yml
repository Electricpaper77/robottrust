name: RobotTrust validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAY_USAGE_STATS_ENABLED: "0"
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m robottrust.generator --episodes 100 --seed 42 --output evidence/episodes.jsonl
      - run: python -m robottrust.evaluator --input evidence/episodes.jsonl --output-dir evidence
      - run: python -c "from robottrust.evidence import verify_checksums; assert verify_checksums('evidence')"
  streaming-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 180
      - run: python scripts/b3_transport_integration.py --ledger work/b3-ci.sqlite3 --output-dir work/b3-ci-evidence
      - run: python scripts/b3_reconciliation_integration.py --ledger work/b3-reconciliation.sqlite3 --output-dir work/b3-ci-evidence/reconciliation
      - if: always()
        run: mkdir -p work/b3-ci-evidence && docker compose logs --no-color > work/b3-ci-evidence/broker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3-real-broker-evidence
          path: work/b3-ci-evidence
      - if: always()
        run: docker compose down
