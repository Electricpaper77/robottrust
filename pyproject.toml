[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robottrust"
version = "0.1.0"
description = "Canonical robotics policy evaluation foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "ray==2.54.0", "confluent-kafka==2.15.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
